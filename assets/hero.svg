    <path d="M 0 480 Q 200 580 400 480 T 800 480 T 1200 480 T 1600 480" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 0 420 Q 200 320 400 420 T 800 420 T 1200 420 T 1600 420" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  <g fill="#F5C56A" opacity="0.6">
